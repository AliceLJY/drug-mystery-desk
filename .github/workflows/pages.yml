name: Pages

# Serves the single-file build (npm run build:standalone) on GitHub Pages.
# Redeploys on every push to main, so the live game never drifts from the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs on purpose: when deploy-pages ran in the
  # same job, half a second after the upload, the artifact listing had not
  # caught up yet and it failed with "No artifacts named github-pages"
  # (three times on 2026-11-25). A separate job gives the listing time.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:standalone
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
